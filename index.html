<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwipeCareer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,500&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="logo">Swipe<span>Career</span></div>
    <div class="streak">🔥 0 concepts learned</div>
  </div>

  <div class="stack" id="stack"></div>

  <div class="actions">
    <button class="actionBtn nope" id="nopeBtn" aria-label="Skip this concept">✕</button>
    <button class="actionBtn info" id="infoBtn" aria-label="See full explanation">i</button>
    <button class="actionBtn love" id="loveBtn" aria-label="Mark as learned">♥</button>
  </div>
</div>

<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet">
    <h3 id="sheetTitle">How it works</h3>
    <div class="sub" id="sheetSub"></div>
    <div class="section-label">Code</div>
    <div class="codebox" id="sheetCode"></div>
    <div class="section-label">Console output</div>
    <div class="console" id="sheetConsole"></div>
    <div class="section-label">Explanation</div>
    <div class="explain" id="sheetExplain"></div>
    <button class="closeSheet" id="closeSheet">Got it</button>
  </div>
</div>

<div class="match-overlay" id="matchOverlay">
  <h1>It clicked!</h1>
  <div class="match-photo" id="matchPhoto"></div>
  <p id="matchText">You and this concept are clearly compatible.</p>
  <button class="match-cta" id="viewRecipe">Review the code</button>
  <button class="keep-swiping" id="keepSwiping">Keep swiping</button>
</div>

<script src="script.js"></script>
</body>
</html>
